# Runs the production target of the Dockerfile against a remote database,
# so the exact image that gets deployed can be smoke-tested locally.
#
#   RAILS_MASTER_KEY=$(cat config/master.key) \
#     docker compose -f compose.prod.yaml up --build
#
# DATABASE_URL must point at Neon (single database — see config/database.yml).
#
# This still boots through the Dockerfile's default CMD (Thruster on port
# 80, mapped to 8080 below). The deployed Render service overrides that
# start command to bind Puma directly to $PORT instead; see render.yaml.
name: fitness_meal_tracker_production

services:
  web:
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the Supabase connection string}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?read it from config/master.key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
    ports:
      - "8080:80"
